{% extends 'base.html' %}
{% block content %}
<h1>💸 Lançamentos</h1>
<div class="form-container">
    <form method="POST" action="/add">
        <input name="data" type="date" required value="{{ hoje }}">
        <input name="descricao" placeholder="Descrição" required>
        <select name="tipo" id="tipo_select" onchange="updateCats()">
            <option value="Despesa">Despesa</option>
            <option value="Receita">Receita</option>
        </select>
        <select name="categoria" id="cat_select"></select>
        <input name="valor" type="number" step="0.01" placeholder="Valor" required>
        <button type="submit">Salvar</button>
    </form>
</div>

<table>
    <tr><th>Data</th><th>Descrição</th><th>Cat.</th><th>Valor</th><th>Ação</th></tr>
    {% for d in dados %}
    <tr>
        <td>{{ d.data.strftime('%d/%m') }}</td>
        <td>{{ d.descricao }}</td>
        <td><span class="tag">{{ d.categoria }}</span></td>
        <td style="color: {{ '#22c55e' if d.tipo == 'Receita' else '#ef4444' }}">R$ {{ d.valor }}</td>
        <td><a href="/delete/{{ d.id }}" style="color: #f87171;">Excluir</a></td>
    </tr>
    {% endfor %}
</table>

<script>
    const cats = {{ categorias_select|tojson|safe }};
    function updateCats() {
        const t = document.getElementById('tipo_select').value;
        const s = document.getElementById('cat_select');
        s.innerHTML = '';
        cats[t].forEach(c => s.options.add(new Option(c, c)));
    }
    window.onload = updateCats;
</script>
{% endblock %}
